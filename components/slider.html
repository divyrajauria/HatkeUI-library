<!-- Hatke UI · Slider · v0 -->
<div class="hk-range">
  <div class="hk-range__head"><label for="hk-range-1">Volume</label><span class="hk-range__val" aria-hidden="true">40</span></div>
  <div class="hk-range__track">
    <input id="hk-range-1" type="range" min="0" max="100" value="40">
    <output class="hk-range__bubble" for="hk-range-1" aria-hidden="true">40</output>
  </div>
</div>

<style>
.hk-range { --a: var(--hk-accent, #2f54eb); --off: var(--hk-muted, #dde1e7); --f: .4; --tilt: 0deg; width: 280px; max-width: 100%; }
.hk-range__head { display: flex; justify-content: space-between; font-size: 14px; color: var(--hk-sub, #5a606c); }
.hk-range__val { color: var(--hk-ink, #121418); font-variant-numeric: tabular-nums; }
.hk-range__track { position: relative; }
.hk-range input { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 44px; margin: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.hk-range input:focus { outline: none; }
.hk-range input::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: linear-gradient(to right, var(--a) calc(11px + var(--f) * (100% - 22px)), var(--off) 0); }
.hk-range input::-moz-range-track { height: 6px; border-radius: 999px; background: var(--off); }
.hk-range input::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--a); }
.hk-range input::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border: 0; border-radius: 50%;
  background: var(--hk-knob, #fff); box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.22);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
}
.hk-range input::-moz-range-thumb {
  width: 22px; height: 22px; border: 0; border-radius: 50%;
  background: var(--hk-knob, #fff); box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.22);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
}
.hk-range input:active::-webkit-slider-thumb { transform: scale(1.25); }
.hk-range input:active::-moz-range-thumb { transform: scale(1.25); }
.hk-range input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--hk-paper, #fff), 0 0 0 5px var(--a); }
.hk-range input:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--hk-paper, #fff), 0 0 0 5px var(--a); }
.hk-range__bubble {
  position: absolute; bottom: calc(100% - 6px); left: calc(11px + var(--f) * (100% - 22px));
  min-width: 36px; padding: 4px 8px; border-radius: 8px; box-sizing: border-box;
  background: var(--hk-ink, #121418); color: var(--hk-paper, #fff); font-size: 13px; text-align: center;
  font-variant-numeric: tabular-nums; pointer-events: none; opacity: 0;
  transform-origin: 50% calc(100% + 16px); transform: translateX(-50%) rotate(var(--tilt)) scale(.6);
  transition: opacity .16s, transform .12s cubic-bezier(.2,.8,.2,1);
}
.hk-range.is-active .hk-range__bubble, .hk-range input:focus-visible + .hk-range__bubble { opacity: 1; transform: translateX(-50%) rotate(var(--tilt)); }
@media (prefers-reduced-motion: reduce) {
  .hk-range input::-webkit-slider-thumb { transition: none; }
  .hk-range input::-moz-range-thumb { transition: none; }
  .hk-range__bubble { transition: opacity .16s; }
}
</style>

<script>
(function(){
    document.querySelectorAll('.hk-range:not([data-hk])').forEach(function (r) {
      r.setAttribute('data-hk', '');
      var i = r.querySelector('input'), bub = r.querySelector('.hk-range__bubble'), val = r.querySelector('.hk-range__val');
      var still = matchMedia('(prefers-reduced-motion: reduce)');
      var last = +i.value, lastT = performance.now(), push = 0, ang = 0, raf = 0;
      function paint() {
        var min = +i.min || 0, max = +i.max || 100;
        r.style.setProperty('--f', (i.value - min) / (max - min));
        bub.textContent = i.value;
        if (val) val.textContent = i.value;
      }
      function tick() { // a damped spring back to upright
        push *= .82;
        ang += (push - ang) * .25;
        r.style.setProperty('--tilt', ang.toFixed(2) + 'deg');
        if (Math.abs(ang) > .05 || Math.abs(push) > .05) raf = requestAnimationFrame(tick);
        else { raf = 0; r.style.setProperty('--tilt', '0deg'); }
      }
      i.addEventListener('input', function () {
        var now = performance.now(), dt = Math.max(8, now - lastT), range = (+i.max || 100) - (+i.min || 0);
        var vel = (i.value - last) / range * 100 / dt;
        last = +i.value; lastT = now;
        paint();
        if (still.matches) return;
        push = Math.max(-22, Math.min(22, -vel * 70));
        if (!raf) raf = requestAnimationFrame(tick);
      });
      var kb = 0, pointer = false;
      i.addEventListener('keydown', function () { // keyboard users see the bubble while they change the value
        if (pointer) return;
        r.classList.add('is-active'); clearTimeout(kb);
        kb = setTimeout(function () { r.classList.remove('is-active'); }, 900);
      });
      i.addEventListener('pointerdown', function () { pointer = true; clearTimeout(kb); r.classList.add('is-active'); });
      ['pointerup', 'pointercancel'].forEach(function (ev) { addEventListener(ev, function () { if (pointer) { pointer = false; r.classList.remove('is-active'); } }); });
      paint();
    });
  })();
</script>
