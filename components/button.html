<!-- Nudge · Button · v0 -->
<div class="nd-btn-wrap">
  <button class="nd-btn" type="button" data-state="idle">
    <span class="nd-btn__label">Save changes</span>
    <span class="nd-btn__dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <svg class="nd-btn__icon nd-btn__ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    <svg class="nd-btn__icon nd-btn__err" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10"/><path d="M17 7L7 17"/></svg>
  </button>
  <p class="nd-btn__status" role="status"></p>
</div>

<style>
.nd-btn-wrap { display: grid; justify-items: center; gap: 8px; }
.nd-btn {
  --a: var(--nd-accent, #2f54eb); --bad: var(--nd-danger, #d92d20);
  position: relative; display: inline-grid; place-items: center; box-sizing: border-box;
  height: 44px; min-width: 44px; padding: 0 22px; border: 0; border-radius: 999px;
  background: var(--nd-ink, #121418); color: var(--nd-paper, #fff); font: inherit; font-weight: 600;
  white-space: nowrap; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: width .34s cubic-bezier(.2,.8,.2,1), background-color .2s, transform .32s cubic-bezier(.34,1.56,.64,1);
}
.nd-btn > * { grid-area: 1 / 1; }
.nd-btn:active { transform: scale(.96); transition-duration: .34s, .2s, .12s; }
.nd-btn:focus-visible { outline: 2px solid var(--a); outline-offset: 3px; }
.nd-btn:not([data-state="idle"]) { padding: 0; cursor: default; }
.nd-btn__label { transition: opacity .14s, transform .2s cubic-bezier(.2,.8,.2,1); }
.nd-btn:not([data-state="idle"]) .nd-btn__label { opacity: 0; transform: scale(.92); }
.nd-btn__dots { display: flex; gap: 4px; opacity: 0; transition: opacity .14s; }
.nd-btn__dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: nd-btn-dot .9s ease-in-out infinite paused; }
.nd-btn__dots i:nth-child(2) { animation-delay: .12s; }
.nd-btn__dots i:nth-child(3) { animation-delay: .24s; }
.nd-btn[data-state="loading"] .nd-btn__dots { opacity: 1; transition-delay: .2s; }
.nd-btn[data-state="loading"] .nd-btn__dots i { animation-play-state: running; }
.nd-btn__icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.nd-btn__ok { stroke-dasharray: 21; stroke-dashoffset: 21; transition: stroke-dashoffset .12s; }
.nd-btn__err path { stroke-dasharray: 15; stroke-dashoffset: 15; transition: stroke-dashoffset .12s; }
.nd-btn[data-state="done"], .nd-btn[data-state="error"] { color: var(--nd-on-accent, #fff); }
.nd-btn[data-state="done"] { background: var(--a); }
.nd-btn[data-state="done"] .nd-btn__ok,
.nd-btn[data-state="error"] .nd-btn__err path { stroke-dashoffset: 0; transition: stroke-dashoffset .3s cubic-bezier(.2,.8,.2,1) .1s; }
.nd-btn[data-state="error"] { background: var(--bad); animation: nd-shake .42s cubic-bezier(.36,.07,.19,.97); }
.nd-btn__status { margin: 0; min-height: 1.4em; font-size: .875em; color: var(--nd-sub, #5a606c); }
.nd-btn__status.is-bad { color: var(--nd-danger, #d92d20); }
@keyframes nd-btn-dot { 0%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-4px); opacity: 1; } }
@keyframes nd-shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-2.5px); } 80% { transform: translateX(1px); } }
@media (prefers-reduced-motion: reduce) {
  .nd-btn, .nd-btn * { transition-duration: 0s !important; transition-delay: 0s !important; }
  .nd-btn, .nd-btn__dots i { animation: none !important; }
}
</style>

<script>
(function(){
    document.querySelectorAll('.nd-btn:not([data-nd])').forEach(function (b) {
      b.setAttribute('data-nd', '');
      var status = b.parentNode.querySelector('.nd-btn__status');
      // Replace task() with your real request. Resolve = saved, reject = failed.
      function task() {
        return new Promise(function (ok, fail) { setTimeout(b.dataset.fail === 'true' ? fail : ok, 1200); });
      }
      b.addEventListener('click', function () {
        if (b.dataset.state !== 'idle') return;
        var w = b.offsetWidth;
        b.style.width = w + 'px';
        void b.offsetWidth;
        b.dataset.state = 'loading';
        b.setAttribute('aria-busy', 'true');
        b.style.width = b.offsetHeight + 'px';
        if (status) { status.textContent = ''; status.classList.remove('is-bad'); }
        task().then(function () { return 'done'; }, function () { return 'error'; }).then(function (r) {
          b.dataset.state = r;
          b.removeAttribute('aria-busy');
          if (status) {
            status.textContent = r === 'done' ? 'Saved' : 'Couldn’t save. Try again.';
            status.classList.toggle('is-bad', r === 'error');
          }
          setTimeout(function () {
            b.style.width = w + 'px';
            b.dataset.state = 'idle';
            setTimeout(function () { b.style.width = ''; }, 360);
          }, r === 'done' ? 900 : 1300);
        });
      });
    });
  })();
</script>
