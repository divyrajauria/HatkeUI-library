<style>
.hk-checks { border: 0; margin: 0; padding: 0; display: grid; min-width: 200px; }
.hk-checks legend { padding: 0; margin-bottom: 4px; font-size: .8em; color: var(--hk-sub, #5a606c); }
.hk-check {
  --a: var(--hk-accent, #2f54eb); --line: var(--hk-line, #c9ced6);
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer;
  user-select: none; -webkit-tap-highlight-color: transparent;
}
.hk-check input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.hk-check__box {
  flex: none; display: grid; place-items: center; width: 22px; height: 22px;
  border: 1.5px solid var(--line); border-radius: 7px;
  transition: background-color .2s cubic-bezier(.2,.8,.2,1), border-color .2s, transform .32s cubic-bezier(.34,1.56,.64,1);
}
.hk-check:active .hk-check__box { transform: scale(.86); transition-duration: .2s, .2s, .12s; }
.hk-check input:checked + .hk-check__box { background: var(--a); border-color: var(--a); }
.hk-check svg {
  width: 16px; height: 16px; fill: none; stroke: var(--hk-on-accent, #fff); stroke-width: 2.6;
  stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 21; stroke-dashoffset: 21;
  transition: stroke-dashoffset .12s;
}
.hk-check input:checked + .hk-check__box svg { stroke-dashoffset: 0; transition: stroke-dashoffset .3s cubic-bezier(.2,.8,.2,1) .08s; }
.hk-check input:focus-visible + .hk-check__box { outline: 2px solid var(--a); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .hk-check__box, .hk-check svg { transition: none !important; } }
</style>
