<!-- Hatke UI · Tabs · v0 -->
<div class="hk-tabs">
  <div class="hk-tabs__list" role="tablist" aria-label="Project">
    <button type="button" role="tab" id="hk-tab-1" aria-controls="hk-panel-1" aria-selected="true">Overview</button>
    <button type="button" role="tab" id="hk-tab-2" aria-controls="hk-panel-2" aria-selected="false" tabindex="-1">Activity</button>
    <button type="button" role="tab" id="hk-tab-3" aria-controls="hk-panel-3" aria-selected="false" tabindex="-1">Settings</button>
    <span class="hk-tabs__ink" aria-hidden="true"></span>
  </div>
  <div class="hk-tabs__panel" role="tabpanel" id="hk-panel-1" aria-labelledby="hk-tab-1" tabindex="0">Three screens shipped this week. Two are waiting on review.</div>
  <div class="hk-tabs__panel" role="tabpanel" id="hk-panel-2" aria-labelledby="hk-tab-2" tabindex="0" hidden>Maya left a comment on Checkout twelve minutes ago.</div>
  <div class="hk-tabs__panel" role="tabpanel" id="hk-panel-3" aria-labelledby="hk-tab-3" tabindex="0" hidden>Notifications are on for mentions only.</div>
</div>

<style>
.hk-tabs { --a: var(--hk-accent, #2f54eb); width: 340px; max-width: 100%; }
.hk-tabs__list { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; box-shadow: inset 0 -1px var(--hk-line, #d6dae0); }
.hk-tabs__list::-webkit-scrollbar { display: none; }
.hk-tabs__list [role="tab"] {
  flex: none; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px 8px 0 0; background: none;
  color: var(--hk-sub, #5a606c); font: inherit; font-weight: 500; cursor: pointer;
  transition: color .2s; -webkit-tap-highlight-color: transparent;
}
.hk-tabs__list [role="tab"]:hover, .hk-tabs__list [aria-selected="true"] { color: var(--hk-ink, #121418); }
.hk-tabs__list [role="tab"]:focus-visible { outline: 2px solid var(--a); outline-offset: -2px; }
.hk-tabs__ink { position: absolute; bottom: 0; left: 0; right: 100%; height: 2px; border-radius: 2px; background: var(--a); }
.hk-tabs__panel { padding: 16px 2px 0; line-height: 1.55; animation: hk-tab-in .32s cubic-bezier(.2,.8,.2,1); }
.hk-tabs__panel:focus-visible { outline: 2px solid var(--a); outline-offset: 4px; border-radius: 4px; }
@keyframes hk-tab-in { from { opacity: 0; transform: translateX(var(--hk-dx, 0)); } }
@media (prefers-reduced-motion: reduce) { .hk-tabs__panel { animation: none; } .hk-tabs__ink { transition: none !important; } }
</style>

<script>
(function(){
    document.querySelectorAll('.hk-tabs:not([data-hk])').forEach(function (root) {
      root.setAttribute('data-hk', '');
      var list = root.querySelector('[role="tablist"]'), ink = root.querySelector('.hk-tabs__ink');
      var tabs = [].slice.call(list.querySelectorAll('[role="tab"]'));
      var cur = Math.max(0, tabs.findIndex(function (t) { return t.getAttribute('aria-selected') === 'true'; }));
      var e = 'cubic-bezier(.2,.8,.2,1)';
      function place(dir) {
        var t = tabs[cur], l = t.offsetLeft, r = list.scrollWidth - l - t.offsetWidth;
        // the edge you are moving toward leaves first; the other follows 90ms later
        ink.style.transition = !dir ? 'none'
          : dir > 0 ? 'right .24s ' + e + ', left .24s ' + e + ' .09s'
          : 'left .24s ' + e + ', right .24s ' + e + ' .09s';
        ink.style.left = l + 'px';
        ink.style.right = r + 'px';
      }
      function select(i, focus) {
        if (i === cur) return;
        var dir = i > cur ? 1 : -1;
        tabs.forEach(function (t, j) {
          var on = j === i, p = document.getElementById(t.getAttribute('aria-controls'));
          t.setAttribute('aria-selected', String(on));
          t.tabIndex = on ? 0 : -1;
          if (p) { p.hidden = !on; if (on) p.style.setProperty('--hk-dx', dir * 10 + 'px'); }
        });
        cur = i;
        if (focus) tabs[i].focus();
        place(dir);
      }
      tabs.forEach(function (t, i) { t.addEventListener('click', function () { select(i); }); });
      list.addEventListener('keydown', function (ev) {
        var n = tabs.length, k = ev.key;
        var i = k === 'ArrowRight' ? (cur + 1) % n : k === 'ArrowLeft' ? (cur - 1 + n) % n : k === 'Home' ? 0 : k === 'End' ? n - 1 : -1;
        if (i < 0) return;
        ev.preventDefault();
        select(i, true);
      });
      place(0);
      addEventListener('resize', function () { place(0); });
      if (document.fonts) document.fonts.ready.then(function () { place(0); });
    });
  })();
</script>
