<!-- Hatke UI · Toggle · v0 -->
<div class="hk-switch-row">
  <span id="hk-switch-1">Airplane mode</span>
  <button class="hk-switch" type="button" role="switch" aria-checked="false" aria-labelledby="hk-switch-1"><span class="hk-switch__knob"></span></button>
</div>
<div class="hk-switch-row">
  <span id="hk-switch-2">Wi-Fi</span>
  <button class="hk-switch" type="button" role="switch" aria-checked="true" aria-labelledby="hk-switch-2"><span class="hk-switch__knob"></span></button>
</div>

<style>
.hk-switch-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; width: 240px; max-width: 100%; }
.hk-switch {
  --a: var(--hk-accent, #2f54eb); --off: var(--hk-muted, #dde1e7); --k: 26px;
  position: relative; flex: none; width: 52px; height: 32px; padding: 0; border: 0; border-radius: 999px;
  background: var(--off); cursor: pointer; isolation: isolate; -webkit-tap-highlight-color: transparent;
}
.hk-switch::before { content: ""; position: absolute; inset: -6px -4px; } /* 44px hit target */
.hk-switch::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--a);
  clip-path: circle(0 at 16px 50%); transition: clip-path .32s cubic-bezier(.2,.8,.2,1);
}
.hk-switch[aria-checked="true"]::after { clip-path: circle(46px at 16px 50%); }
.hk-switch__knob {
  position: absolute; z-index: 1; top: 3px; left: 3px; width: var(--k); height: 26px; border-radius: 999px;
  background: var(--hk-knob, #fff); box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.08);
  transition: left .36s cubic-bezier(.34,1.56,.64,1), width .18s cubic-bezier(.2,.8,.2,1);
}
.hk-switch:active { --k: 33px; } /* stretch on press */
.hk-switch[aria-checked="true"] .hk-switch__knob { left: calc(100% - var(--k) - 3px); }
.hk-switch:focus-visible { outline: 2px solid var(--a); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .hk-switch::after, .hk-switch__knob { transition-duration: 0s; } }
</style>

<script>
(function(){
    document.querySelectorAll('.hk-switch:not([data-hk])').forEach(function (s) {
      s.setAttribute('data-hk', '');
      s.addEventListener('click', function () {
        s.setAttribute('aria-checked', s.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
      });
    });
  })();
</script>
