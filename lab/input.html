<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravity field · Hatke UI lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
/* 08 Gravity input */
.grav{width:300px;max-width:100%}
.grav-box{position:relative}
.grav input{display:block;width:100%;height:58px;padding:22px 14px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:transparent;caret-color:var(--ink);font:inherit;font-size:16px;line-height:24px;letter-spacing:.01em;outline:0;transition:border-color .2s,box-shadow .2s}
.grav input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.grav input::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.grav-mirror{position:absolute;left:15.5px;top:23.5px;font-size:16px;line-height:24px;letter-spacing:.01em;white-space:pre;pointer-events:none}
.grav-mirror span{display:inline-block}
.grav label{position:absolute;left:15.5px;top:18px;color:var(--sub);font-size:16px;line-height:20px;pointer-events:none;transform-origin:0 0;transition:transform .25s var(--spring),color .2s}
.grav input:focus~label,.grav input:not(:placeholder-shown)~label{transform:translateY(-11px) scale(.74)}
.grav input:focus~label{color:var(--accent)}
.grav-ghost{position:absolute;font-size:16px;line-height:24px;white-space:pre;pointer-events:none}
.grav-foot{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:13px;color:var(--sub)}
.grav-count{font-variant-numeric:tabular-nums}
.grav.bad input,.grav.bad input:focus{border-color:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 18%,transparent)}
.grav.bad .grav-msg,.grav.bad label{color:var(--danger)}
</style>
</head>
<body class="solo">
<main>
<article class="card" id="input">
      <div class="card-h"><span class="no">08</span><h2>Gravity field</h2><span class="was">was: head-shake</span></div>
      <div class="stage"><div class="stage-inner">
        <div class="grav">
          <div class="grav-box">
            <input id="gv" type="text" placeholder=" " maxlength="18" autocomplete="off" spellcheck="false" data-allow="[A-Za-z0-9.]" aria-describedby="gv-msg">
            <span class="grav-mirror" aria-hidden="true"></span>
            <label for="gv">Username</label>
          </div>
          <div class="grav-foot"><span class="grav-msg" id="gv-msg" aria-live="polite">Letters, numbers and dots.</span><span class="grav-count" aria-hidden="true">0/18</span></div>
        </div>
      </div></div>
      <div class="card-b">
        <p class="idea"><b>Letters have weight.</b> Each character drops into the field and lands with a bounce. Delete one and it falls out of the bottom. A character the field can't take bounces off and flies away.</p>
        <div class="try"><span>Try</span><span>type</span><span>backspace</span><span>type a !</span><span>paste</span></div>
      </div>
    </article>
</main>
<script src="spring.js"></script>
<script>
/* ---------- 08 Gravity field ---------- */
document.querySelectorAll('.grav').forEach(function(f){
  var input = f.querySelector('input'), box = f.querySelector('.grav-box'), mir = f.querySelector('.grav-mirror'),
      msg = f.querySelector('.grav-msg'), cnt = f.querySelector('.grav-count');
  var ok = new RegExp('^' + input.dataset.allow + '*$'), hint = msg.textContent, prev = '', badT = 0;
  function count(){ cnt.textContent = input.value.length + '/' + input.maxLength; }
  function spanX(i){ var s = mir.children[i]; return s ? mir.offsetLeft + s.offsetLeft : mir.offsetLeft + mir.offsetWidth; }
  function ghost(ch, x, frames, dur, color){
    if (RM.matches) return;
    var g = document.createElement('span'); g.className = 'grav-ghost'; g.textContent = ch;
    g.style.left = x + 'px'; g.style.top = mir.offsetTop + 'px'; if (color) g.style.color = color; box.appendChild(g);
    g.animate(frames, { duration: dur, easing: 'cubic-bezier(.4,0,.9,.5)', fill: 'forwards' }).onfinish = function(){ g.remove(); };
  }
  function render(str, from, n){
    mir.textContent = '';
    str.split('').forEach(function(c, i){
      var s = document.createElement('span'); s.textContent = c; mir.appendChild(s);
      if (i >= from && i < from + n && !RM.matches){
        var k = i - from;
        s.animate([{ transform: 'translateY(-18px) rotate(' + (Math.random() * 30 - 15) + 'deg) scale(1.3)', opacity: 0 }, { transform: 'translateY(2px) scale(.92,1.08)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { duration: 380, delay: k * 30, easing: 'cubic-bezier(.3,.8,.4,1.2)', fill: 'backwards' });
      }
    });
  }
  input.addEventListener('input', function(){
    var next = input.value, a = 0, b = 0;
    while (a < prev.length && a < next.length && prev[a] === next[a]) a++;
    while (b < prev.length - a && b < next.length - a && prev[prev.length - 1 - b] === next[next.length - 1 - b]) b++;
    var removed = prev.slice(a, prev.length - b), added = next.slice(a, next.length - b);
    if (!ok.test(next)){ // refuse: the bad character bounces off and flies away
      var caret = input.selectionStart - added.length;
      input.value = prev; input.setSelectionRange(caret, caret);
      var x = spanX(a);
      added.replace(new RegExp(input.dataset.allow, 'g'), '').split('').slice(0, 3).forEach(function(c, i){
        ghost(c, x + i * 6, [{ transform: 'translateY(-16px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1, offset: .3 }, { transform: 'translate(' + (40 + i * 12) + 'px,-46px) rotate(220deg)', opacity: 0 }], 620, 'var(--danger)');
      });
      f.classList.add('bad'); msg.textContent = 'Only letters, numbers and dots.';
      if (!RM.matches) box.animate([{ transform: 'none' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(-2px)' }, { transform: 'none' }], { duration: 380 });
      clearTimeout(badT); badT = setTimeout(function(){ f.classList.remove('bad'); msg.textContent = hint; }, 2200);
      return;
    }
    removed.split('').forEach(function(c, i){ // deleted letters fall out of the bottom
      var x = spanX(a + i), dir = Math.random() < .5 ? -1 : 1;
      ghost(c, x, [{ transform: 'none', opacity: 1 }, { transform: 'translate(' + dir * 6 + 'px,-6px) rotate(' + dir * 10 + 'deg)', opacity: 1, offset: .2 }, { transform: 'translate(' + dir * 14 + 'px,42px) rotate(' + dir * 80 + 'deg)', opacity: 0 }], 520 + i * 40);
    });
    prev = next; render(next, a, added.length); count();
  });
  count();
});
</script>
</body>
</html>
